<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal World</title>
<style>
body{margin:0;font-family:Arial;background:#f1f7f4;color:#173b2d}
header{background:#104c39;color:white;text-align:center;padding:30px 15px}
header h1{font-size:32px;margin:0}
header p{font-size:15px}
input{width:85%;padding:13px;border:1px solid #ccc;border-radius:10px;margin:15px auto;display:block}
nav{text-align:center;padding:10px}
button{background:#17664b;color:white;border:0;padding:10px 15px;border-radius:20px;margin:4px}
.container{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px}
.card{background:white;border-radius:15px;padding:20px;text-align:center;box-shadow:0 2px 8px #ddd}
.card span{font-size:45px}
.card h3{margin:10px 0 5px}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>🌍 Animal World</h1>
<p>Discover amazing animals and explore nature!</p>
</header>

<input type="text" id="search" placeholder="Search animals..." oninput="searchAnimals()">

<nav>
<button onclick="filterAnimals('All')">All</button>
<button onclick="filterAnimals('Mammals')">Mammals</button>
<button onclick="filterAnimals('Birds')">Birds</button>
<button onclick="filterAnimals('Reptiles')">Reptiles</button>
<button onclick="filterAnimals('Sea Life')">Sea Life</button>
</nav>

<h2 style="text-align:center">Discover Animals 🐾</h2>
<div class="container" id="animals"></div>

<footer>© 2026 Animal World | Learn About Nature</footer>

<script>
const data=[
["🦁","Lion","Mammals"],
["🐘","Elephant","Mammals"],
["🐅","Tiger","Mammals"],
["🦊","Fox","Mammals"],
["🐨","Koala","Mammals"],
["🐼","Panda","Mammals"],
["🦒","Giraffe","Mammals"],
["🐬","Dolphin","Sea Life"],
["🦈","Shark","Sea Life"],
["🐢","Turtle","Reptiles"],
["🐊","Crocodile","Reptiles"],
["🦅","Eagle","Birds"],
["🦜","Parrot","Birds"],
["🦉","Owl","Birds"]
];

function showAnimals(list){
document.getElementById("animals").innerHTML=list.map(a=>
`<div class="card"><span>${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p></div>`
).join("");
}

function filterAnimals(category){
showAnimals(category==="All"?data:data.filter(a=>a[2]===category));
}

function searchAnimals(){
let q=document.getElementById("search").value.toLowerCase();
showAnimals(data.filter(a=>a[1].toLowerCase().includes(q)));
}

showAnimals(data);
</script>
</body>
</html>
